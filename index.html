<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>BIST30 Trading Panel</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: Arial;
    background: #0f172a;
    color: #e5e7eb;
}

.app {
    padding: 16px;
}

.topbar {
    height: 64px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 18px;
    margin-bottom: 16px;
}

.brand {
    font-size: 22px;
    font-weight: bold;
    color: #93c5fd;
}

.layout {
    display: grid;
    grid-template-columns: 280px 1fr 420px;
    gap: 16px;
    align-items: stretch;
}

.card {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 14px;
}

.card-title {
    color: #93c5fd;
    margin-bottom: 10px;
}

.mini-list {
    max-height: 200px;
    overflow-y: auto;
}

.mini-item {
    display: flex;
    justify-content: space-between;
    padding: 8px;
    background: #0f172a;
    border-radius: 8px;
    margin-bottom: 5px;
    cursor: pointer;
}

.mini-item:hover {
    background: #334155;
}

.main, .right-panel {
    height: 100%;
}

.selected-symbol {
    font-size: 24px;
    font-weight: bold;
}

canvas {
    width: 100%;
    height: 420px !important;
    background: #111827;
    border-radius: 14px;
    padding: 8px;
    transition: all 0.4s ease;
}

/* METRICS ALTTA */
.metrics {
    display: flex;
    gap: 10px;
    margin-top: 10px;
}

.metric {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 10px;
    min-width: 110px;
}

.metric span {
    font-size: 12px;
    color: #94a3b8;
}

.metric strong {
    font-size: 18px;
}

/* TABLE */
input {
    width: 100%;
    padding: 10px;
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 10px;
    color: white;
    margin-bottom: 10px;
}

button {
    background: #334155;
    border: none;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
}

button.active {
    background: #2563eb;
}

.favorite-btn {
    transition: all 0.2s;
}

.favorite-btn:hover {
    background: #2563eb;
    transform: scale(1.2);
}

table {
    width: 100%;
    border-collapse: collapse;
}

td, th {
    padding: 8px;
    text-align: center;
}

tr:hover {
    background: #334155;
}

.table-wrap {
    max-height: 600px;
    overflow-y: auto;
}
</style>
</head>

<body>

<div class="app">

<div class="topbar">
    <div class="brand">BIST30</div>
    <div id="sonVeriBilgisi">Son veri: -</div>
</div>

<div class="layout">

<!-- SOL PANEL -->
<div>
    <div class="card">
        <div class="card-title">RSI Yüksek</div>
        <div id="rsiYuksekListe" class="mini-list"></div>
    </div>

    <div class="card">
        <div class="card-title">RSI Düşük</div>
        <div id="rsiDusukListe" class="mini-list"></div>
    </div>

    <div class="card">
        <div class="card-title">EMA200 Üstünde</div>
        <div id="emaUstuListe" class="mini-list"></div>
    </div>
</div>

<!-- ORTA -->
<div class="main">
    <div class="card">
        <div class="selected-symbol" id="seciliHisseBaslik">Seç</div>

        <canvas id="chart"></canvas>

        <!-- ALT METRICS -->
        <div class="metrics">
            <div class="metric">
                <span>RSI</span>
                <strong id="metricRsi">-</strong>
            </div>
            <div class="metric">
                <span>EMA200</span>
                <strong id="metricEma">-</strong>
            </div>
            <div class="metric">
                <span>Fiyat</span>
                <strong id="metricFiyat">-</strong>
            </div>
        </div>
    </div>
</div>

<!-- SAĞ PANEL -->
<div class="right-panel">
    <div class="card">
        <div class="card-title">Hisseler</div>

        <input id="aramaKutusu" placeholder="Ara..." onkeyup="tabloyuGuncelle()">

        <div>
            <button onclick="filtreSec('tum')" id="btnTum" class="active">Tümü</button>
            <button onclick="filtreSec('favori')" id="btnFav">Favori</button>
        </div>

        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>⭐</th>
                        <th>Hisse</th>
                        <th>RSI</th>
                        <th>EMA</th>
                        <th>Fiyat</th>
                    </tr>
                </thead>
                <tbody id="hisseTablosu"></tbody>
            </table>
        </div>
    </div>
</div>

</div>
</div>

<script>
const API = "http://3.79.16.80:5000";

let tumVeriler = [];
let seciliHisse = "";
let chart;
let favoriler = JSON.parse(localStorage.getItem("fav")) || [];
let aktifFiltre = "tum";

function saatFormatla(t){
    const d = new Date(t);
    return d.getHours().toString().padStart(2,"0") + ":00";
}

function veriYukle(){
    fetch(API+"/signals/latest")
    .then(r=>r.json())
    .then(data=>{
        tumVeriler = data;
        tabloyuGuncelle();
        solListeleri();
        sonSaat();

        if(!seciliHisse && data.length){
            hisseSec(data[0].symbol);
        }
    })
}

function sonSaat(){
    let son = tumVeriler[0].time;
    tumVeriler.forEach(x=>{
        if(new Date(x.time)>new Date(son)) son=x.time;
    });
    document.getElementById("sonVeriBilgisi").innerText="Son veri: "+saatFormatla(son);
}

function solListeleri(){
    const yuksek = tumVeriler.filter(x=>x.rsi>=70);
    const dusuk = tumVeriler.filter(x=>x.rsi<=30);
    const ema = tumVeriler.filter(x=>x.close>x.ema200);

    liste("rsiYuksekListe",yuksek,"rsi");
    liste("rsiDusukListe",dusuk,"rsi");
    liste("emaUstuListe",ema,"close");
}

function liste(id,data,alan){
    let div=document.getElementById(id);
    div.innerHTML="";
    data.forEach(x=>{
        div.innerHTML+=`<div class="mini-item" onclick="hisseSec('${x.symbol}')">
        <span>${x.symbol}</span><span>${x[alan].toFixed(2)}</span></div>`;
    });
}

function tabloyuGuncelle(){
    let arama=document.getElementById("aramaKutusu").value.toUpperCase();
    let liste=tumVeriler.filter(x=>x.symbol.includes(arama));

    if(aktifFiltre==="favori"){
        liste=liste.filter(x=>favoriler.includes(x.symbol));
    }

    let html="";
    liste.forEach(x=>{
        html+=`
        <tr onclick="hisseSec('${x.symbol}')">
            <td>
            <button class="favorite-btn" onclick="event.stopPropagation(); fav('${x.symbol}')">
            ${favoriler.includes(x.symbol)?"⭐":"☆"}
            </button>
            </td>
            <td>${x.symbol}</td>
            <td>${x.rsi.toFixed(2)}</td>
            <td>${x.ema200.toFixed(2)}</td>
            <td>${x.close.toFixed(2)}</td>
        </tr>`;
    });

    document.getElementById("hisseTablosu").innerHTML=html;
}

function filtreSec(f){
    aktifFiltre=f;
    tabloyuGuncelle();
}

function fav(s){
    if(favoriler.includes(s)){
        favoriler=favoriler.filter(x=>x!==s);
    }else{
        favoriler.push(s);
    }
    localStorage.setItem("fav",JSON.stringify(favoriler));
    tabloyuGuncelle();
}

function hisseSec(s){
    seciliHisse=s;

    let veri=tumVeriler.find(x=>x.symbol===s);

    document.getElementById("seciliHisseBaslik").innerText=s;
    document.getElementById("metricRsi").innerText=veri.rsi.toFixed(2);
    document.getElementById("metricEma").innerText=veri.ema200.toFixed(2);
    document.getElementById("metricFiyat").innerText=veri.close.toFixed(2);

    fetch(API+"/signals/hourly/"+s)
    .then(r=>r.json())
    .then(d=>{
        document.getElementById("chart").style.opacity=0.3;

        setTimeout(()=>{
            grafik(d);
            document.getElementById("chart").style.opacity=1;
        },200);
    })
}

function grafik(d){
    if(chart) chart.destroy();

    chart=new Chart(document.getElementById("chart"),{
        type:"line",
        data:{
            labels:d.map(x=>saatFormatla(x.time)),
            datasets:[
                {label:"RSI",data:d.map(x=>x.rsi),borderColor:"#22c55e"},
                {label:"EMA",data:d.map(x=>x.ema200),borderColor:"#ef4444"},
                {label:"Fiyat",data:d.map(x=>x.close),borderColor:"#60a5fa"}
            ]
        },
        options:{
            animation:{duration:800},
            responsive:true
        }
    });
}

veriYukle();
setInterval(veriYukle,15000);
</script>

</body>
</html>
